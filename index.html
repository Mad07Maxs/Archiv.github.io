<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theater-Archiv Dashboard & GitHub Sync</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Outfit & Playfair Display -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        theater: {
                            950: '#090d16',
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            gold: '#d4af37',
                            goldLight: '#f3e5ab',
                            accent: '#e21d48',
                            purple: '#7e22ce',
                            teal: '#0d9488'
                        }
                    }
                }

        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; }

        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

</head>
<body class="bg-theater-950 text-slate-100 h-full flex flex-col selection:bg-amber-500 selection:text-slate-950">

    <header class="bg-theater-900 border-b border-slate-800 sticky top-0 z-30 shadow-2xl">

                <div>

    <script>
        const DEFAULT_CONFIG = {
            token: '', 
            repo: 'Mad07Maxs/Archiv.github.io', 
            branch: 'main',
            path: 'archiv.json'
        };

        let ghConfig = JSON.parse(localStorage.getItem('theater_gh_config')) || DEFAULT_CONFIG;
        let currentSha = null; 
        let plays = JSON.parse(localStorage.getItem('theater_archive_plays')) || [];
        let viewMode = 'grid';

        // Robuste UTF-8 konforme Base64 Encodierung
        function utf8ToBase64(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                return String.fromCharCode('0x' + p1);
            }));
        }

        // Robuste UTF-8 konforme Base64 Decodierung
        function base64ToUtf8(str) {
            return decodeURIComponent(Array.prototype.map.call(atob(str), function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
        }

        // Extrahiert Jahreszahlen aus Datums-Strings zur exakten Sortierung
        function extractYear(dateStr) {
            if (!dateStr) return 0;
            const match = dateStr.match(/\b(19\d\d|20\d\d)\b/);
            if (match) return parseInt(match[1], 10);
            const numMatch = dateStr.match(/\d+/);
            return numMatch ? parseInt(numMatch[0], 10) : 0;
        }

        function updateSyncStatus(type, message) {
            const badge = document.getElementById('syncBadge');
            const dot = document.getElementById('syncDot');
            const text = document.getElementById('syncText');
            const icon = document.getElementById('syncIcon');

            if (type === 'syncing') {
                dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
                text.innerText = message || 'Synchronisiere...';
                badge.className = 'inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20';
                if(icon) icon.classList.add('fa-spin');
            } else if (type === 'success') {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
                text.innerText = message || 'Mit GitHub synchronisiert';
                badge.className = 'inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                if(icon) icon.classList.remove('fa-spin');
            } else if (type === 'error') {
                dot.className = 'w-2 h-2 rounded-full bg-rose-500';
                text.innerText = message || 'GitHub Fehler';
                badge.className = 'inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20';
                if(icon) icon.classList.remove('fa-spin');
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-slate-500';
                text.innerText = 'Token eintragen';
                badge.className = 'inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700';
                if(icon) icon.classList.remove('fa-spin');
            }
        }

        async function syncFromGitHub(manual = false) {
            if (!ghConfig.token || !ghConfig.repo) {
                updateSyncStatus('off');
                if (manual) openSettingsModal();
                return;
            }

            updateSyncStatus('syncing', 'Lade von GitHub...');

            const url = `https://api.github.com/repos/${ghConfig.repo}/contents/${ghConfig.path}?ref=${ghConfig.branch}`;

            try {
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `token ${ghConfig.token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (response.status === 404) {
                    currentSha = null;
                    updateSyncStatus('syncing', 'Erstelle archiv.json...');
                    await pushToGitHub();
                    return;
                }

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                currentSha = data.sha;
                
                const jsonContent = base64ToUtf8(data.content.replace(/\n/g, ''));
                const loadedPlays = JSON.parse(jsonContent);

                if (Array.isArray(loadedPlays)) {
                    plays = loadedPlays;
                    plays.forEach(p => {
                        if (p.checkpoints && p.checkpoints.page === undefined) {
                            p.checkpoints.page = false;
                        }
                    });
                    localStorage.setItem('theater_archive_plays', JSON.stringify(plays));
                    renderDashboard();
                    updateSyncStatus('success', 'GitHub Daten geladen');
                }
            } catch (err) {
                console.error('GitHub Sync Fetch Error:', err);
                updateSyncStatus('error', 'Fehler beim Laden');
            }
        }

        // Behebt den Speicherfehler durch exaktes SHA-Fetching und robuste PUT-Abfrage
        async function pushToGitHub() {
            if (!ghConfig.token || !ghConfig.repo) {
                updateSyncStatus('off');
                return;
            }

            updateSyncStatus('syncing', 'Speichere auf GitHub...');

            const url = `https://api.github.com/repos/${ghConfig.repo}/contents/${ghConfig.path}`;

            try {
                // Vor dem PUT prüfen wir immer das aktuelle SHA, um Konflikte (409 Conflict) und Speicherfehler zu vermeiden
                const checkRes = await fetch(`${url}?ref=${ghConfig.branch}`, {
                    headers: {
                        'Authorization': `token ${ghConfig.token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (checkRes.ok) {
                    const checkData = await checkRes.json();
                    currentSha = checkData.sha;
                } else if (checkRes.status === 404) {
                    currentSha = null;
                }

                const contentEncoded = utf8ToBase64(JSON.stringify(plays, null, 2));

                const bodyData = {
                    message: `Update Theater-Archiv (${plays.length} Stücke)`,
                    content: contentEncoded,
                    branch: ghConfig.branch
                };

                if (currentSha) {
                    bodyData.sha = currentSha;
                }

                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${ghConfig.token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bodyData)
                });

                if (!response.ok) {
                    const errRes = await response.json();
                    throw new Error(errRes.message || `HTTP ${response.status}`);
                }

                const resData = await response.json();
                currentSha = resData.content.sha;
                updateSyncStatus('success', 'Auf GitHub gespeichert');
            } catch (err) {
                console.error('GitHub Push Error:', err);
                updateSyncStatus('error', 'Speicherfehler!');
                showNotification('Speicherfehler bei GitHub: ' + err.message, 'error');
            }
        }

        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('btnGridView').className = mode === 'grid' 
                ? 'px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-amber-500 text-slate-950 font-semibold shadow' 
                : 'px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-white';
            document.getElementById('btnTableView').className = mode === 'table' 
                ? 'px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-amber-500 text-slate-950 font-semibold shadow' 
                : 'px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-white';
            renderDashboard();
        }

        function calculateStats() {
            const total = plays.length;
            let completeCount = 0;
            let totalCheckpoints = 0;
            let checkedCount = 0;
            let pagesCount = 0;

            plays.forEach(p => {
                if(!p.checkpoints) return;
                const keys = Object.keys(p.checkpoints);
                const pChecked = keys.filter(k => p.checkpoints[k]).length;
                totalCheckpoints += keys.length;
                checkedCount += pChecked;
                if (pChecked === keys.length) completeCount++;
                if (p.checkpoints.page) pagesCount++;
            });

            const inProgress = total - completeCount;
            const rate = totalCheckpoints > 0 ? Math.round((checkedCount / totalCheckpoints) * 100) : 0;

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statComplete').innerText = completeCount;
            document.getElementById('statPages').innerText = `${pagesCount} / ${total}`;
            document.getElementById('statInProgress').innerText = inProgress;
            document.getElementById('statRate').innerText = rate + '%';
        }

        function toggleCheckpointQuick(playId, key) {
            const play = plays.find(p => p.id === playId);
            if (play) {
                play.checkpoints[key] = !play.checkpoints[key];
                localStorage.setItem('theater_archive_plays', JSON.stringify(plays));
                renderDashboard();
                pushToGitHub();
            }
        }

        function renderDashboard() {
            calculateStats();
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filterStatus = document.getElementById('filterStatus').value;
            const sortOrder = document.getElementById('sortOrder').value;
            const container = document.getElementById('archiveContainer');

            // 1. Filtern
            let filtered = plays.filter(p => {
                const matchesSearch = 
                    p.title.toLowerCase().includes(searchTerm) || 
                    p.date.toLowerCase().includes(searchTerm) || 
                    (p.director && p.director.toLowerCase().includes(searchTerm)) ||
                    (p.cast && p.cast.toLowerCase().includes(searchTerm));

                if (!matchesSearch) return false;

                const cp = p.checkpoints || {};
                const isComplete = Object.values(cp).length >= 7 && Object.values(cp).every(Boolean);

                if (filterStatus === 'complete') return isComplete;
                if (filterStatus === 'incomplete') return !isComplete;
                if (filterStatus === 'missing_page') return !cp.page;
                if (filterStatus === 'missing_flyer') return !cp.flyer;
                if (filterStatus === 'missing_poster') return !cp.poster;
                if (filterStatus === 'missing_cast') return !cp.cast;

                return true;
            });

            // 2. Sortieren nach Jahreszahl
            filtered.sort((a, b) => {
                const yearA = extractYear(a.date);
                const yearB = extractYear(b.date);
                if (sortOrder === 'desc') {
                    return yearB - yearA; // Neueste zuerst
                } else {
                    return yearA - yearB; // Älteste zuerst
                }
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-theater-900/40 border border-slate-800 rounded-2xl p-12 text-center">
                        <div class="w-16 h-16 bg-slate-800/80 rounded-2xl flex items-center justify-center mx-auto text-slate-500 text-2xl mb-4">
                            <i class="fa-solid fa-masks-theater"></i>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-1">Keine Stücke gefunden</h3>
                        <p class="text-sm text-slate-400">Erstelle ein neues Stück oder passe deine Suchfilter an.</p>
                    </div>
                `;
                return;
            }

            if (viewMode === 'grid') {
                let gridHtml = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">';
                filtered.forEach(p => {
                    const cp = p.checkpoints || {};
                    const cpList = [
                        { key: 'page', label: 'Seite erstellt', active: cp.page, highlight: true },
                        { key: 'flyer', label: 'Flyer', active: cp.flyer },
                        { key: 'poster', label: 'Plakat', active: cp.poster },
                        { key: 'info', label: 'Infotext', active: cp.info },
                        { key: 'images', label: 'Bilder', active: cp.images },
                        { key: 'date', label: 'Datum', active: cp.date },
                        { key: 'cast', label: 'Rollen', active: cp.cast },
                    ];
                    const activeCount = cpList.filter(x => x.active).length;
                    const percent = Math.round((activeCount / 7) * 100);

                    gridHtml += `
                        <div class="bg-theater-900/80 border border-slate-800 hover:border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col justify-between transition-all duration-300 group">
                            <div>
                                ${p.imageUrl ? `<img src="${escapeHtml(p.imageUrl)}" onerror="this.style.display='none'" class="w-full h-36 object-cover rounded-xl mb-4 border border-slate-800">` : ''}
                                
                                <div class="flex items-start justify-between gap-3 mb-3">
                                    <div>
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20 mb-2">
                                            <i class="fa-regular fa-calendar mr-1.5"></i> ${escapeHtml(p.date)}
                                        </span>
                                        <h3 class="text-xl font-bold font-playfair text-white group-hover:text-amber-400 transition-colors">${escapeHtml(p.title)}</h3>
                                        ${p.director ? `<p class="text-xs text-slate-400 mt-0.5"><i class="fa-solid fa-user-gear text-slate-500 mr-1"></i>Regie: ${escapeHtml(p.director)}</p>` : ''}
                                    </div>
                                    
                                    <div class="flex items-center space-x-1">
                                        <button onclick="editPlay('${p.id}')" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition-colors" title="Bearbeiten">
                                            <i class="fa-solid fa-pen text-xs"></i>
                                        </button>
                                        <button onclick="deletePlay('${p.id}')" class="w-8 h-8 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 flex items-center justify-center transition-colors" title="Löschen">
                                            <i class="fa-solid fa-trash text-xs"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <p class="text-sm text-slate-300 line-clamp-2 mb-4">${escapeHtml(p.description || 'Keine Beschreibung hinterlegt.')}</p>
                                
                                <div class="mb-4 text-xs text-slate-400 bg-theater-950 p-3 rounded-xl border border-slate-800">
                                    <span class="font-semibold text-slate-300"><i class="fa-solid fa-users text-amber-400 mr-1.5"></i>Darsteller:</span> 
                                    <p class="truncate mt-0.5 text-slate-300">${escapeHtml(p.cast || 'Keine Rollen eingetragen')}</p>
                                </div>
                            </div>

                            <div>
                                <div class="flex items-center justify-between text-xs font-semibold mb-2">
                                    <span class="text-slate-400 uppercase tracking-wider">Checkpoints</span>
                                    <span class="${percent === 100 ? 'text-emerald-400' : 'text-amber-400'}">${activeCount}/7 (${percent}%)</span>
                                </div>
                                <div class="grid grid-cols-2 gap-1.5">
                                    ${cpList.map(c => `
                                        <button onclick="toggleCheckpointQuick('${p.id}', '${c.key}')" class="flex items-center space-x-2 text-xs py-1.5 px-2.5 rounded-lg text-left transition-all ${c.highlight ? (c.active ? 'col-span-2 bg-teal-500/20 text-teal-300 border border-teal-500/40 font-semibold' : 'col-span-2 bg-slate-950 text-slate-500 border border-slate-800 hover:border-slate-700') : (c.active ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20' : 'bg-slate-950 text-slate-500 border border-slate-800 hover:border-slate-700')}">
                                            <i class="fa-solid ${c.key === 'page' ? 'fa-globe' : (c.active ? 'fa-circle-check text-emerald-400' : 'fa-circle-xmark text-slate-600')}"></i>
                                            <span class="truncate">${c.label}</span>
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                });
                gridHtml += '</div>';
                container.innerHTML = gridHtml;
            } else {
                let tableHtml = `
                    <div class="bg-theater-900/80 border border-slate-800 rounded-2xl shadow-xl overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-800 bg-theater-950 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                                    <th class="p-4">Stück & Jahr</th>
                                    <th class="p-4">Regie</th>
                                    <th class="p-4">Webseite Erstellt</th>
                                    <th class="p-4 text-center">Status</th>
                                    <th class="p-4 text-right">Aktionen</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800 text-sm">
                `;
                filtered.forEach(p => {
                    const cp = p.checkpoints || {};
                    const activeCount = Object.keys(cp).filter(k => cp[k]).length;
                    const percent = Math.round((activeCount / 7) * 100);

                    tableHtml += `
                        <tr class="hover:bg-slate-800/30 transition-colors">
                            <td class="p-4">
                                <div class="font-bold font-playfair text-white text-base">${escapeHtml(p.title)}</div>
                                <div class="text-xs text-amber-400 mt-0.5"><i class="fa-regular fa-calendar mr-1"></i>${escapeHtml(p.date)}</div>
                            </td>
                            <td class="p-4 text-slate-300">${escapeHtml(p.director || '-')}</td>
                            <td class="p-4">
                                <button onclick="toggleCheckpointQuick('${p.id}', 'page')" class="px-3 py-1 rounded-lg text-xs font-medium inline-flex items-center space-x-1.5 ${cp.page ? 'bg-teal-500/20 text-teal-300 border border-teal-500/30' : 'bg-slate-800 text-slate-500 border border-slate-700'}">
                                    <i class="fa-solid fa-globe"></i>
                                    <span>${cp.page ? 'Ja (Erstellt)' : 'Nein (Offen)'}</span>
                                </button>
                            </td>
                            <td class="p-4 text-center">
                                <span class="px-2.5 py-1 rounded-full text-xs font-medium ${percent === 100 ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}">
                                    ${activeCount}/7 Checkpoints
                                </span>
                            </td>
                            <td class="p-4 text-right space-x-1">
                                <button onclick="editPlay('${p.id}')" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 inline-flex items-center justify-center transition-colors">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button onclick="deletePlay('${p.id}')" class="w-8 h-8 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 inline-flex items-center justify-center transition-colors">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
                tableHtml += '</tbody></table></div>';
                container.innerHTML = tableHtml;
            }
        }

        function openModal(id = null) {
            const modal = document.getElementById('playModal');
            const form = document.getElementById('playForm');
            form.reset();

            if (id) {
                document.getElementById('modalTitle').innerText = 'Theaterstück bearbeiten';
                const play = plays.find(p => p.id === id);
                if (play) {
                    document.getElementById('playId').value = play.id;
                    document.getElementById('formTitle').value = play.title;
                    document.getElementById('formDate').value = play.date;
                    document.getElementById('formDirector').value = play.director || '';
                    document.getElementById('formImageUrl').value = play.imageUrl || '';
                    document.getElementById('formDescription').value = play.description || '';
                    document.getElementById('formCast').value = play.cast || '';

                    const cp = play.checkpoints || {};
                    document.getElementById('checkFlyer').checked = !!cp.flyer;
                    document.getElementById('checkPoster').checked = !!cp.poster;
                    document.getElementById('checkInfo').checked = !!cp.info;
                    document.getElementById('checkImages').checked = !!cp.images;
                    document.getElementById('checkDate').checked = !!cp.date;
                    document.getElementById('checkCast').checked = !!cp.cast;
                    document.getElementById('checkPage').checked = !!cp.page;
                }
            } else {
                document.getElementById('modalTitle').innerText = 'Theaterstück hinzufügen';
                document.getElementById('playId').value = '';
                document.getElementById('checkDate').checked = true;
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('playModal').classList.add('hidden');
        }

        function savePlay(event) {
            event.preventDefault();
            const id = document.getElementById('playId').value;
            const title = document.getElementById('formTitle').value;
            const date = document.getElementById('formDate').value;
            const director = document.getElementById('formDirector').value;
            const imageUrl = document.getElementById('formImageUrl').value;
            const description = document.getElementById('formDescription').value;
            const cast = document.getElementById('formCast').value;

            const checkpoints = {
                flyer: document.getElementById('checkFlyer').checked,
                poster: document.getElementById('checkPoster').checked,
                info: document.getElementById('checkInfo').checked,
                images: document.getElementById('checkImages').checked,
                date: document.getElementById('checkDate').checked,
                cast: document.getElementById('checkCast').checked,
                page: document.getElementById('checkPage').checked,
            };

            if (id) {
                const index = plays.findIndex(p => p.id === id);
                if (index !== -1) {
                    plays[index] = { id, title, date, director, imageUrl, description, cast, checkpoints };
                }
            } else {
                plays.push({
                    id: Date.now().toString(),
                    title,
                    date,
                    director,
                    imageUrl,
                    description,
                    cast,
                    checkpoints
                });
            }

            localStorage.setItem('theater_archive_plays', JSON.stringify(plays));
            closeModal();
            renderDashboard();
            pushToGitHub();
        }

        function editPlay(id) {
            openModal(id);
        }

        function deletePlay(id) {
            if (confirm('Möchtest du dieses Theaterstück wirklich löschen?')) {
                plays = plays.filter(p => p.id !== id);
                localStorage.setItem('theater_archive_plays', JSON.stringify(plays));
                renderDashboard();
                pushToGitHub();
            }
        }

        function openSettingsModal() {
            document.getElementById('ghToken').value = ghConfig.token || '';
            document.getElementById('ghRepo').value = ghConfig.repo || 'Mad07Maxs/Archiv.github.io';
            document.getElementById('ghBranch').value = ghConfig.branch || 'main';
            document.getElementById('ghPath').value = ghConfig.path || 'archiv.json';
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings(e) {
            e.preventDefault();
            ghConfig = {
                token: document.getElementById('ghToken').value.trim(),
                repo: document.getElementById('ghRepo').value.trim() || 'Mad07Maxs/Archiv.github.io',
                branch: document.getElementById('ghBranch').value.trim() || 'main',
                path: document.getElementById('ghPath').value.trim() || 'archiv.json'
            };
            localStorage.setItem('theater_gh_config', JSON.stringify(ghConfig));
            closeSettingsModal();
            syncFromGitHub(true);
        }

        async function testGitHubConnection() {
            const token = document.getElementById('ghToken').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            if (!token || !repo) {
                showNotification('Bitte Token und Repository ausfüllen.', 'error');
                return;
            }
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (res.ok) {
                    showNotification('Verbindung erfolgreich! Zugriff auf Repository vorhanden.', 'success');
                } else {
                    showNotification('Verbindungsfehler: Bitte Token und Repository prüfen.', 'error');
                }
            } catch (err) {
                showNotification('Netzwerkfehler beim Testen der Verbindung.', 'error');
            }
        }

        function showNotification(message, type = 'success') {
            const div = document.createElement('div');
            div.className = `fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold flex items-center space-x-2 border transition-all ${type === 'success' ? 'bg-emerald-950 text-emerald-200 border-emerald-500/40' : 'bg-rose-950 text-rose-200 border-rose-500/40'}`;
            div.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-triangle-exclamation text-rose-400'}"></i><span>${escapeHtml(message)}</span>`;
            document.body.appendChild(div);
            setTimeout(() => {
                div.remove();
            }, 3500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        window.onload = function() {
            renderDashboard();
            if (ghConfig.token && ghConfig.repo) {
                syncFromGitHub();
            } else {
                updateSyncStatus('off');
            }
        };
    </script>
