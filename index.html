<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theater-Archiv Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for gorgeous icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        theater: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            gold: '#d4af37',
                            goldLight: '#f3e5ab',
                            accent: '#e21d48'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        /* Custom scrollbar for clean look */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-theater-900 text-slate-100 h-full flex flex-col selection:bg-theater-gold selection:text-slate-900">

    <header class="bg-theater-800 border-b border-slate-800 sticky top-0 z-30 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center shadow-md shadow-amber-500/20 text-white text-xl font-bold font-playfair">
                    <i class="fa-solid fa-masks-theater"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold font-playfair tracking-wide text-white">Theater-Archiv</h1>
                    <p class="text-xs text-amber-400 font-medium">Dashboard & Produktionsübersicht</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button onclick="openModal()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-semibold px-4 py-2.5 rounded-xl shadow-lg shadow-amber-500/20 transition-all duration-200 flex items-center space-x-2 text-sm">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span class="hidden sm:inline">Neues Stück</span>
                </button>
                <div class="relative group">
                    <button class="bg-theater-700 hover:bg-slate-600 text-slate-200 p-2.5 rounded-xl transition-all text-sm flex items-center justify-center w-10 h-10 border border-slate-600" title="GitHub & Daten-Tools">
                        <i class="fa-solid fa-database"></i>
                    </button>
                    <div class="absolute right-0 mt-2 w-56 bg-theater-800 border border-slate-700 rounded-xl shadow-2xl py-2 hidden group-hover:block z-50">
                        <div class="px-4 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-700">GitHub & Backup</div>
                        <button onclick="exportJSON()" class="w-full text-left px-4 py-2.5 text-sm text-slate-200 hover:bg-theater-700 flex items-center space-x-2 transition-colors">
                            <i class="fa-solid fa-download text-amber-400 w-5"></i>
                            <span>Daten exportieren (JSON)</span>
                        </button>
                        <button onclick="triggerImport()" class="w-full text-left px-4 py-2.5 text-sm text-slate-200 hover:bg-theater-700 flex items-center space-x-2 transition-colors">
                            <i class="fa-solid fa-upload text-amber-400 w-5"></i>
                            <span>Daten importieren</span>
                        </button>
                        <input type="file" id="importFile" class="hidden" accept=".json" onchange="importJSON(event)">
                        <div class="border-t border-slate-700 my-1"></div>
                        <button onclick="loadSampleData()" class="w-full text-left px-4 py-2.5 text-sm text-amber-400 hover:bg-theater-700 flex items-center space-x-2 transition-colors">
                            <i class="fa-solid fa-wand-magic-sparkles w-5"></i>
                            <span>Beispieldaten laden</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- Statistik Banner -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-theater-800/80 border border-slate-800 rounded-2xl p-5 shadow-lg relative overflow-hidden flex items-center justify-between">
                <div>
                    <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Stücke Gesamt</p>
                    <h3 id="statTotal" class="text-3xl font-bold font-playfair text-white mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-slate-700/50 flex items-center justify-center text-amber-400 text-lg">
                    <i class="fa-solid fa-book-open"></i>
                </div>
            </div>
            
            <div class="bg-theater-800/80 border border-slate-800 rounded-2xl p-5 shadow-lg relative overflow-hidden flex items-center justify-between">
                <div>
                    <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Komplett (100%)</p>
                    <h3 id="statComplete" class="text-3xl font-bold font-playfair text-emerald-400 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400 text-lg">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
            </div>

            <div class="bg-theater-800/80 border border-slate-800 rounded-2xl p-5 shadow-lg relative overflow-hidden flex items-center justify-between">
                <div>
                    <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">In Bearbeitung</p>
                    <h3 id="statInProgress" class="text-3xl font-bold font-playfair text-amber-400 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-amber-500/10 flex items-center justify-center text-amber-400 text-lg">
                    <i class="fa-solid fa-spinner"></i>
                </div>
            </div>

            <div class="bg-theater-800/80 border border-slate-800 rounded-2xl p-5 shadow-lg relative overflow-hidden flex items-center justify-between">
                <div>
                    <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Gesamt-Checkpoint-Quote</p>
                    <h3 id="statRate" class="text-3xl font-bold font-playfair text-sky-400 mt-1">0%</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-sky-500/10 flex items-center justify-center text-sky-400 text-lg">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
            </div>
        </div>

        <!-- Filter & Suchleiste -->
        <div class="bg-theater-800/60 border border-slate-800 rounded-2xl p-4 sm:p-5 flex flex-col md:flex-row items-center justify-between gap-4 shadow-md">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-search absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="renderDashboard()" placeholder="Nach Titel, Autor oder Jahr suchen..." class="w-full bg-theater-900 border border-slate-700 rounded-xl pl-11 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition-all">
            </div>
            
            <div class="flex items-center space-x-3 w-full md:w-auto justify-end">
                <span class="text-xs text-slate-400 font-medium whitespace-nowrap">Ansicht:</span>
                <div class="bg-theater-900 p-1 rounded-xl border border-slate-700 flex space-x-1">
                    <button onclick="setViewMode('grid')" id="btnGridView" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-amber-500 text-slate-950 shadow">
                        <i class="fa-solid fa-border-all mr-1.5"></i> Karten
                    </button>
                    <button onclick="setViewMode('table')" id="btnTableView" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-white">
                        <i class="fa-solid fa-table-list mr-1.5"></i> Tabelle
                    </button>
                </div>
            </div>
        </div>

        <div id="archiveContainer">
            <!-- Wird dynamisch per JS gefüllt -->
        </div>

    </main>

    <footer class="bg-theater-800/50 border-t border-slate-800 py-6 mt-12 text-center text-xs text-slate-500">
        <p>Theater-Archiv Dashboard &bull; Ideal für GitHub Pages Deployment &bull; Lokale & JSON Speicherung</p>
    </footer>

    <!-- MODAL FÜR NEU / BEARBEITEN -->
    <div id="playModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-theater-800 border border-slate-700 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="p-6 border-b border-slate-700 flex items-center justify-between sticky top-0 bg-theater-800 z-10">
                <h3 id="modalTitle" class="text-xl font-bold font-playfair text-white">Theaterstück hinzufügen</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-700 hover:bg-slate-600 text-slate-300 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <form id="playForm" onsubmit="savePlay(event)" class="p-6 space-y-5">
                <input type="hidden" id="playId">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1.5">Titel des Stücks *</label>
                        <input type="text" id="formTitle" required class="w-full bg-theater-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500" placeholder="z.B. Ein Sommernachtstraum">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1.5">Datum / Spielzeit *</label>
                        <input type="text" id="formDate" required class="w-full bg-theater-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500" placeholder="z.B. Herbst 2025 / 14.10.2025">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1.5">Kurzbeschreibung / Infotext</label>
                    <textarea id="formDescription" rows="3" class="w-full bg-theater-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500" placeholder="Handlung, Regisseur, besondere Notizen..."></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1.5">Rollen & Darsteller (durch Komma getrennt)</label>
                    <input type="text" id="formCast" class="w-full bg-theater-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500" placeholder="z.B. Anna Müller (Julia), Max Schmidt (Romeo)">
                </div>

                <div class="pt-2">
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-3">Checkpoints / Vorbereitungsstatus</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-theater-900 p-4 rounded-xl border border-slate-700">
                        <label class="flex items-center space-x-3 cursor-pointer select-none">
                            <input type="checkbox" id="checkFlyer" class="w-4 h-4 rounded bg-theater-800 border-slate-600 text-amber-500 focus:ring-amber-500">
                            <span class="text-sm text-slate-200">Flyer vorhanden</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer select-none">
                            <input type="checkbox" id="checkPoster" class="w-4 h-4 rounded bg-theater-800 border-slate-600 text-amber-500 focus:ring-amber-500">
                            <span class="text-sm text-slate-200">Plakat vorhanden</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer select-none">
                            <input type="checkbox" id="checkInfo" class="w-4 h-4 rounded bg-theater-800 border-slate-600 text-amber-500 focus:ring-amber-500">
                            <span class="text-sm text-slate-200">Infotext vorhanden</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer select-none">
                            <input type="checkbox" id="checkImages" class="w-4 h-4 rounded bg-theater-800 border-slate-600 text-amber-500 focus:ring-amber-500">
                            <span class="text-sm text-slate-200">Bilder vorhanden</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer select-none">
                            <input type="checkbox" id="checkDate" class="w-4 h-4 rounded bg-theater-800 border-slate-600 text-amber-500 focus:ring-amber-500">
                            <span class="text-sm text-slate-200">Datum eingetragen</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer select-none">
                            <input type="checkbox" id="checkCast" class="w-4 h-4 rounded bg-theater-800 border-slate-600 text-amber-500 focus:ring-amber-500">
                            <span class="text-sm text-slate-200">Rollen / Darsteller eingetragen</span>
                        </label>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-700">
                    <button type="button" onclick="closeModal()" class="bg-theater-700 hover:bg-slate-600 text-slate-200 px-5 py-2.5 rounded-xl text-sm font-semibold transition-colors">
                        Abbrechen
                    </button>
                    <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-6 py-2.5 rounded-xl text-sm font-semibold transition-colors shadow-lg shadow-amber-500/20">
                        Speichern
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Datenstruktur für Theaterstücke
        let plays = JSON.parse(localStorage.getItem('theater_archive_plays')) || [];
        let viewMode = 'grid'; // 'grid' oder 'table'

        // Beispieldaten initialisieren, falls leer
        if (plays.length === 0) {
            plays = [
                {
                    id: '1',
                    title: 'Ein Sommernachtstraum',
                    date: 'Sommer 2024',
                    description: 'Eine Verwechslungskomödie voller Magie und Liebe im Athener Wald.',
                    cast: 'Anna Müller (Titania), Max Schmidt (Oberon), Lisa Meyer (Puck)',
                    checkpoints: { flyer: true, poster: true, info: true, images: true, date: true, cast: true }
                },
                {
                    id: '2',
                    title: 'Der zerbrochne Krug',
                    date: 'Frühling 2025',
                    description: 'Kleists berühmtes Lustspiel über Richter Adam und ein dunkles Geheimnis.',
                    cast: 'Karl Weber (Richter Adam), Sophie Braun (Frau Marthe)',
                    checkpoints: { flyer: true, poster: false, info: true, images: true, date: true, cast: false }
                }
            ];
            saveToStorage();
        }

        function saveToStorage() {
            localStorage.setItem('theater_archive_plays', JSON.stringify(plays));
        }

        function setViewMode(mode) {
            viewMode = mode;
            const btnGrid = document.getElementById('btnGridView');
            const btnTable = document.getElementById('btnTableView');
            
            if (mode === 'grid') {
                btnGrid.className = 'px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-amber-500 text-slate-950 shadow';
                btnTable.className = 'px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-white';
            } else {
                btnTable.className = 'px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-amber-500 text-slate-950 shadow';
                btnGrid.className = 'px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-white';
            }
            renderDashboard();
        }

        function calculateStats() {
            const total = plays.length;
            let completeCount = 0;
            let totalCheckpoints = 0;
            let checkedCount = 0;

            plays.forEach(p => {
                const keys = Object.keys(p.checkpoints);
                const pChecked = keys.filter(k => p.checkpoints[k]).length;
                totalCheckpoints += keys.length;
                checkedCount += pChecked;
                if (pChecked === keys.length) completeCount++;
            });

            const inProgress = total - completeCount;
            const rate = totalCheckpoints > 0 ? Math.round((checkedCount / totalCheckpoints) * 100) : 0;

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statComplete').innerText = completeCount;
            document.getElementById('statInProgress').innerText = inProgress;
            document.getElementById('statRate').innerText = rate + '%';
        }

        function renderDashboard() {
            calculateStats();
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('archiveContainer');
            
            const filteredPlays = plays.filter(p => 
                p.title.toLowerCase().includes(searchTerm) || 
                p.date.toLowerCase().includes(searchTerm) || 
                p.description.toLowerCase().includes(searchTerm)
            );

            if (filteredPlays.length === 0) {
                container.innerHTML = `
                    <div class="bg-theater-800/40 border border-slate-800 rounded-2xl p-12 text-center">
                        <div class="w-16 h-16 bg-slate-800 rounded-2xl flex items-center justify-center mx-auto text-slate-500 text-2xl mb-4">
                            <i class="fa-solid fa-folder-open"></i>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-1">Keine Stücke gefunden</h3>
                        <p class="text-sm text-slate-400">Füge ein neues Theaterstück hinzu oder passe den Suchbegriff an.</p>
                    </div>
                `;
                return;
            }

            if (viewMode === 'grid') {
                let gridHtml = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">';
                filteredPlays.forEach(p => {
                    const cp = p.checkpoints;
                    const cpList = [
                        { label: 'Flyer', active: cp.flyer },
                        { label: 'Plakat', active: cp.poster },
                        { label: 'Infotext', active: cp.info },
                        { label: 'Bilder', active: cp.images },
                        { label: 'Datum', active: cp.date },
                        { label: 'Rollen', active: cp.cast },
                    ];
                    const activeCount = cpList.filter(x => x.active).length;
                    const percent = Math.round((activeCount / 6) * 100);

                    gridHtml += `
                        <div class="bg-theater-800/80 border border-slate-800 hover:border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col justify-between transition-all duration-300 group">
                            <div>
                                <div class="flex items-start justify-between gap-4 mb-3">
                                    <div>
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20 mb-2">
                                            <i class="fa-regular fa-calendar mr-1.5"></i> ${escapeHtml(p.date)}
                                        </span>
                                        <h3 class="text-xl font-bold font-playfair text-white group-hover:text-amber-400 transition-colors">${escapeHtml(p.title)}</h3>
                                    </div>
                                    <div class="flex items-center space-x-1">
                                        <button onclick="editPlay('${p.id}')" class="w-8 h-8 rounded-lg bg-slate-700/50 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition-colors" title="Bearbeiten">
                                            <i class="fa-solid fa-pen text-xs"></i>
                                        </button>
                                        <button onclick="deletePlay('${p.id}')" class="w-8 h-8 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 flex items-center justify-center transition-colors" title="Löschen">
                                            <i class="fa-solid fa-trash text-xs"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <p class="text-sm text-slate-300 line-clamp-2 mb-4">${escapeHtml(p.description || 'Keine Beschreibung hinterlegt.')}</p>
                                
                                <div class="mb-4 text-xs text-slate-400 bg-theater-900/50 p-2.5 rounded-xl border border-slate-800">
                                    <span class="font-semibold text-slate-300"><i class="fa-solid fa-users mr-1 text-amber-400"></i> Darsteller:</span> 
                                    <span class="block truncate mt-0.5">${escapeHtml(p.cast || 'Keine angegeben')}</span>
                                </div>
                            </div>

                            <div>
                                <div class="flex items-center justify-between text-xs font-semibold mb-2">
                                    <span class="text-slate-400 uppercase tracking-wider">Checkpoints</span>
                                    <span class="${percent === 100 ? 'text-emerald-400' : 'text-amber-400'}">${activeCount}/6 (${percent}%)</span>
                                </div>
                                <div class="grid grid-cols-2 gap-1.5">
                                    ${cpList.map(c => `
                                        <div class="flex items-center space-x-2 text-xs py-1 px-2 rounded-lg ${c.active ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20' : 'bg-slate-900/40 text-slate-500 border border-slate-800'}">
                                            <i class="fa-solid ${c.active ? 'fa-circle-check text-emerald-400' : 'fa-circle-xmark text-slate-600'}"></i>
                                            <span class="truncate">${c.label}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                });
                gridHtml += '</div>';
                container.innerHTML = gridHtml;
            } else {
                let tableHtml = `
                    <div class="bg-theater-800/80 border border-slate-800 rounded-2xl shadow-xl overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-700 bg-theater-900/50 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                                    <th class="p-4">Titel & Datum</th>
                                    <th class="p-4">Beschreibung</th>
                                    <th class="p-4">Darsteller</th>
                                    <th class="p-4 text-center">Status</th>
                                    <th class="p-4 text-right">Aktionen</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800 text-sm">
                `;
                filteredPlays.forEach(p => {
                    const cp = p.checkpoints;
                    const activeCount = Object.keys(cp).filter(k => cp[k]).length;
                    const percent = Math.round((activeCount / 6) * 100);

                    tableHtml += `
                        <tr class="hover:bg-theater-700/30 transition-colors">
                            <td class="p-4">
                                <div class="font-bold font-playfair text-white text-base">${escapeHtml(p.title)}</div>
                                <div class="text-xs text-amber-400 mt-0.5"><i class="fa-regular fa-calendar mr-1"></i>${escapeHtml(p.date)}</div>
                            </td>
                            <td class="p-4 text-slate-300 max-w-xs truncate">${escapeHtml(p.description || '-')}</td>
                            <td class="p-4 text-slate-300 max-w-xs truncate">${escapeHtml(p.cast || '-')}</td>
                            <td class="p-4 text-center">
                                <span class="px-2.5 py-1 rounded-full text-xs font-medium ${percent === 100 ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}">
                                    ${activeCount}/6 Checkpoints
                                </span>
                            </td>
                            <td class="p-4 text-right space-x-1">
                                <button onclick="editPlay('${p.id}')" class="w-8 h-8 rounded-lg bg-slate-700/50 hover:bg-slate-700 text-slate-300 inline-flex items-center justify-center transition-colors">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button onclick="deletePlay('${p.id}')" class="w-8 h-8 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 inline-flex items-center justify-center transition-colors">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
                tableHtml += '</tbody></table></div>';
                container.innerHTML = tableHtml;
            }
        }

        function openModal(id = null) {
            const modal = document.getElementById('playModal');
            const form = document.getElementById('playForm');
            form.reset();
            
            if (id) {
                document.getElementById('modalTitle').innerText = 'Theaterstück bearbeiten';
                const play = plays.find(p => p.id === id);
                if (play) {
                    document.getElementById('playId').value = play.id;
                    document.getElementById('formTitle').value = play.title;
                    document.getElementById('formDate').value = play.date;
                    document.getElementById('formDescription').value = play.description;
                    document.getElementById('formCast').value = play.cast;
                    
                    document.getElementById('checkFlyer').checked = play.checkpoints.flyer;
                    document.getElementById('checkPoster').checked = play.checkpoints.poster;
                    document.getElementById('checkInfo').checked = play.checkpoints.info;
                    document.getElementById('checkImages').checked = play.checkpoints.images;
                    document.getElementById('checkDate').checked = play.checkpoints.date;
                    document.getElementById('checkCast').checked = play.checkpoints.cast;
                }
            } else {
                document.getElementById('modalTitle').innerText = 'Theaterstück hinzufügen';
                document.getElementById('playId').value = '';
                // Standardmäßig Datum und Rollen abhaken wenn Text da ist, oder frei lassen
                document.getElementById('checkDate').checked = true;
            }
            
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('playModal').classList.add('hidden');
        }

        function savePlay(event) {
            event.preventDefault();
            const id = document.getElementById('playId').value;
            const title = document.getElementById('formTitle').value;
            const date = document.getElementById('formDate').value;
            const description = document.getElementById('formDescription').value;
            const cast = document.getElementById('formCast').value;

            const checkpoints = {
                flyer: document.getElementById('checkFlyer').checked,
                poster: document.getElementById('checkPoster').checked,
                info: document.getElementById('checkInfo').checked,
                images: document.getElementById('checkImages').checked,
                date: document.getElementById('checkDate').checked,
                cast: document.getElementById('checkCast').checked,
            };

            if (id) {
                const index = plays.findIndex(p => p.id === id);
                if (index !== -1) {
                    plays[index] = { id, title, date, description, cast, checkpoints };
                }
            } else {
                const newPlay = {
                    id: Date.now().toString(),
                    title,
                    date,
                    description,
                    cast,
                    checkpoints
                };
                plays.push(newPlay);
            }

            saveToStorage();
            closeModal();
            renderDashboard();
        }

        function editPlay(id) {
            openModal(id);
        }

        function deletePlay(id) {
            if (confirm('Möchtest du dieses Theaterstück wirklich aus dem Archiv löschen?')) {
                plays = plays.filter(p => p.id !== id);
                saveToStorage();
                renderDashboard();
            }
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(plays, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "theater_archiv_daten.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        plays = imported;
                        saveToStorage();
                        renderDashboard();
                        alert('Daten erfolgreich importiert!');
                    } else {
                        alert('Ungültiges Format.');
                    }
                } catch (err) {
                    alert('Fehler beim Lesen der JSON-Datei.');
                }
            };
            reader.readAsText(file);
        }

        function loadSampleData() {
            if (confirm('Aktuelle Daten überschreiben und Beispieldaten laden?')) {
                localStorage.removeItem('theater_archive_plays');
                location.reload();
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('"', '&quot;').replace("'", '&#039;');
        }

        // Initialisierung beim Laden
        window.onload = function() {
            renderDashboard();
        };
    </script>
</body>
</html>
